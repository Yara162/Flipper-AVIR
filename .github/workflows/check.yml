name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tools/avir.py validate
      - run: python3 tools/avir.py catalog --check
      - run: python3 tools/avir.py universal --check
      - run: python3 -m unittest discover -v tests
